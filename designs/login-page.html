<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingredify — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #f9fafb; --foreground: #111827; --card: #fff; --muted: #f3f4f6;
      --border: #e5e7eb; --accent: #22c55e; --secondary: #6b7280; --destructive: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; margin-bottom: 32px; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 1px 3px color-mix(in oklch, var(--foreground) 6%, transparent);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 14px; font-weight: 500; }
    input {
      height: 44px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      background: var(--card);
      outline: none;
    }
    input:focus { border-color: color-mix(in oklch, var(--accent) 45%, transparent); box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 20%, transparent); }
    .submit {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .footer { margin-top: 16px; text-align: center; font-size: 14px; color: var(--secondary); }
    .footer a { color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <a class="logo" href="#"><span class="logo-mark">i</span> Ingredify</a>
  <div class="card" data-od-id="login-form">
    <h1>Вход</h1>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="submit">Войти</button>
      <p class="footer">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </form>
  </div>
</body>
</html>
