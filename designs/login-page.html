<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingredify — Вход</title>
  <link rel="stylesheet" href="shared-tokens.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 800;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 1px 2px color-mix(in oklch, var(--foreground) 6%, transparent);
    }
    @media (min-width: 768px) {
      .card { padding: 32px; }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label { font-size: 14px; font-weight: 500; }
    .submit {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 14px;
      font-weight: 500;
    }
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--secondary);
    }
    .footer a {
      color: var(--accent);
      font-weight: 500;
    }
    form { display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body>
  <a class="logo" href="#"><span class="logo-mark">i</span> Ingredify</a>
  <div class="card" data-od-id="login-form">
    <h1>Вход</h1>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input-auth" type="email" name="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" class="input-auth" type="password" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="submit">Войти</button>
      <p class="footer">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </form>
  </div>
</body>
</html>
