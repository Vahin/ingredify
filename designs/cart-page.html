<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingredify — Корзина</title>
  <link rel="stylesheet" href="shared-tokens.css" />
  <style>
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--card) 95%, transparent);
      backdrop-filter: blur(14px);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
    }
    @media (min-width: 768px) {
      .header-inner {
        grid-template-columns: 190px minmax(280px, 1fr) auto;
        gap: 24px;
        padding: 16px 24px;
      }
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
    }
    @media (min-width: 768px) {
      .logo { font-size: 21px; }
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 800;
    }
    .search {
      position: relative;
      order: 3;
      grid-column: 1 / -1;
      min-width: 0;
    }
    @media (min-width: 768px) {
      .search { order: 0; grid-column: auto; }
    }
    .search input {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: var(--muted);
      padding: 0 20px 0 48px;
      font-size: 14px;
      outline: 1px solid transparent;
    }
    .search input:focus {
      background: var(--card);
      outline-color: color-mix(in oklch, var(--accent) 45%, transparent);
    }
    .search input::placeholder { color: var(--secondary); }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--secondary);
      width: 18px;
      height: 18px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }
    @media (min-width: 768px) {
      main { padding-inline: 24px; }
    }
    .page-head {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .page-sub {
      margin-top: 4px;
      color: var(--secondary);
      font-size: 14px;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .recipe-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .recipe-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }
    .recipe-group-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }
    .recipe-link {
      flex-shrink: 0;
      color: var(--secondary);
      font-size: 12px;
      text-underline-offset: 2px;
    }
    .recipe-link:hover {
      text-decoration: underline;
    }
    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .empty-state {
      margin-top: 28px;
      padding: 32px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--card);
      text-align: center;
    }
    .empty-title {
      font-size: 16px;
      font-weight: 600;
    }
    .empty-text {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="#"><span class="logo-mark">i</span> Ingredify</a>
      <label class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input type="search" placeholder="Найти рецепт, ингредиент или кухню" />
      </label>
      <div class="header-actions">
        <a class="cart-link" href="#" aria-label="Открыть корзину">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">7</span>
        </a>
        <button type="button" class="btn-ghost">Войти</button>
        <button type="button" class="btn-primary">Регистрация</button>
      </div>
    </div>
  </header>

  <main data-od-id="cart-page">
    <div class="page-head">
      <h1>Корзина</h1>
      <p class="page-sub">Список ингредиентов для покупки</p>
    </div>

    <section class="tabs" data-od-id="cart-filled">
      <div class="tabs-list" role="tablist" aria-label="Вид корзины">
        <button type="button" class="tabs-trigger is-active">По рецептам</button>
        <button type="button" class="tabs-trigger">Общий список</button>
      </div>

      <section class="recipe-group">
        <div class="recipe-group-head">
          <h2 class="recipe-group-title">Вишневый коблер с миндальной крошкой</h2>
          <a class="recipe-link" href="#">К рецепту</a>
        </div>
        <div class="cart-list">
          <div class="cart-row">
            <img class="sticker" src="ingredients/cherry.png" alt="" />
            <div><p class="cart-row-title">Вишня без косточек</p></div>
            <div class="cart-row-meta">
              <span class="amount-mono"><span>500</span><span>г</span></span>
              <button type="button" class="btn-ghost" style="height:24px;padding:0 8px;font-size:12px">Удалить</button>
            </div>
          </div>
          <div class="cart-row">
            <img class="sticker" src="ingredients/sugar.png" alt="" />
            <div><p class="cart-row-title">Сахар</p></div>
            <div class="cart-row-meta">
              <span class="amount-mono"><span>120</span><span>г</span></span>
              <button type="button" class="btn-ghost" style="height:24px;padding:0 8px;font-size:12px">Удалить</button>
            </div>
          </div>
          <div class="cart-row">
            <img class="sticker" src="ingredients/flour.png" alt="" />
            <div><p class="cart-row-title">Пшеничная мука</p></div>
            <div class="cart-row-meta">
              <span class="amount-mono"><span>145</span><span>г</span></span>
              <button type="button" class="btn-ghost" style="height:24px;padding:0 8px;font-size:12px">Удалить</button>
            </div>
          </div>
          <div class="cart-row">
            <img class="sticker" src="ingredients/butter.png" alt="" />
            <div>
              <p class="cart-row-title">Сливочное масло</p>
              <p class="cart-row-sub">Подрецепт</p>
            </div>
            <div class="cart-row-meta">
              <span class="amount-mono"><span>85</span><span>г</span></span>
              <button type="button" class="btn-ghost" style="height:24px;padding:0 8px;font-size:12px">Удалить</button>
            </div>
          </div>
          <div class="cart-row">
            <img class="sticker" src="ingredients/milk.png" alt="" />
            <div><p class="cart-row-title">Молоко</p></div>
            <div class="cart-row-meta">
              <span class="amount-mono"><span>120</span><span>мл</span></span>
              <button type="button" class="btn-ghost" style="height:24px;padding:0 8px;font-size:12px">Удалить</button>
            </div>
          </div>
        </div>
      </section>
    </section>

    <section class="empty-state" data-od-id="cart-empty">
      <p class="empty-title">Корзина пуста</p>
      <p class="empty-text">Добавьте ингредиенты из рецепта через меню в сайдбаре.</p>
    </section>
  </main>
</body>
</html>
