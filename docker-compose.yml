# Локальная PostgreSQL для разработки
services:
  db:
    image: postgres:16-alpine
    container_name: ingredify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingredify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingredify}
      POSTGRES_DB: ${POSTGRES_DB:-ingredify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ingredify-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
